# cargo-deny configuration
# Run: cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
# Only check dependencies for the host platform (Linux); ignore Windows-only deps.
targets = [
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "wasm32-unknown-unknown" },
]

# ── Advisories (CVE / security) ─────────────────────────────────────────────
[advisories]
# Check unmaintained status across the whole dependency graph, including
# transitive deps (not just workspace members) — some indirect deps lag.
unmaintained = "all"
yanked = "warn"
# Ignore specific advisories by ID if you've assessed and accepted the risk:
ignore = [
  # paste: unmaintained, pulled in transitively by leptos/tachys macros.
  # No safe upgrade exists upstream; not something tidl can fix directly.
  "RUSTSEC-2024-0436",
  # proc-macro-error2: unmaintained, pulled in transitively by leptos macros
  # (leptos_macro, reactive_stores_macro, rstml). No safe upgrade upstream.
  "RUSTSEC-2026-0173",
  # rustls-pemfile: unmaintained, pulled in transitively. No safe upgrade upstream.
  "RUSTSEC-2025-0134",
  # rsa (Marvin Attack, timing sidechannel): pulled in by openidconnect (RS256
  # JWT verification) and sqlx-core. No safe upgrade exists upstream yet.
  "RUSTSEC-2023-0071",
]

# ── Licenses ─────────────────────────────────────────────────────────────────
[licenses]
# Fail on any license not in this allow-list.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "Zlib",
  "MPL-2.0",
  "0BSD",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
]
# Confidence threshold for license text detection (0.0–1.0).
confidence-threshold = 0.8

# ── Bans ─────────────────────────────────────────────────────────────────────
[bans]
# Deny multiple versions of the same crate (flag accidental dep duplication).
multiple-versions = "warn"
# Crates that must never appear in the dependency graph.
deny = []

# ── Sources ──────────────────────────────────────────────────────────────────
[sources]
# Only allow crates from crates.io and this git repo.
unknown-registry = "deny"
unknown-git = "deny"
