[server]
host = "0.0.0.0"
port = 3060
domain = "tidl.example.com"
log_level = "info"
encryption_key_file = "tidl-enc-key"
# Required — the server refuses to start while this is empty.
# Generate with: tidl-server generate-key
# Protects the SMTP password and any remote CalDAV personal access tokens
# stored (encrypted) in the DB.
secret = ""

[paths]
data_dir = "./data"

[auth]
# Users list - password hashes generated with bcrypt
# Generate a hash with: tidl-server hash-password <password>
users = [
    # Fake placeholder - replace with a real hash from: tidl-server hash-password <password>
    { username = "admin", password_hash = "$2b$12$KIXxkCPZpYyQN5U5pJ5zQO5g5Y5zQO5g5Y5zQO5g5Y5zQO5g5Y5zQO" }
]

[oidc]
issuer_url    = "https://auth.example.com/oauth2/openid/tidl"
client_id     = "tidl"
client_secret = "changeme"
provider_name = "Example"

[smtp]
host = "smtp.example.com"
port = 587
tls_mode = "starttls"
username = "tidl@example.com"
password = "changeme"
from_address = "tidl@example.com"
from_name = "Tidl"

[caldav]
# Default calendar name
default_calendar = "personal"

[sync]
# Enable markdown synchronization
enabled = true
# How often to scan for changes (seconds)
watch_interval_secs = 5

# Markdown source configurations
[[sync.sources]]
type = "filesystem"
name = "My Notes"
path = "/home/user/notes"
enabled = true
recursive = true

# Example: Future source types (commented out)
# [[sync.sources]]
# type = "dropbox"
# name = "Dropbox Notes"
# app_key = "your-app-key"
# app_secret = "your-app-secret"
# path = "/Notes"
# enabled = false
