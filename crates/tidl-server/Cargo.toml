[package]
name = "tidl-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "tidl-server"
path = "src/main.rs"

[dependencies]
# Workspace crates
tidl-caldav = { path = "../tidl-caldav" }
tidl-carddav = { path = "../tidl-carddav" }
tidl-markdown = { path = "../tidl-markdown" }
tidl-web = { path = "../tidl-web", features = ["ssr"] }

# Workspace dependencies
tokio = { workspace = true }
tokio-stream = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
sqlx = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
argon2 = { workspace = true }
bcrypt = { workspace = true }
base64 = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
leptos_axum = { workspace = true }
leptos = { workspace = true, features = ["ssr"] }
http = { workspace = true }
async-trait = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true }
percent-encoding = "2"
clap = { version = "4", features = ["derive"] }
walkdir = "2.4"
lettre = { workspace = true }
aes-gcm = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
mail-parser = { workspace = true }
mailrs-spf = { workspace = true }
hickory-resolver = { workspace = true }
dashmap = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
openidconnect = { workspace = true }
git2 = { workspace = true }

# When cross-compiling for Windows, bundle SQLite so the binary has no runtime
# dependency on a system sqlite3.dll.  On Linux the system sqlite is used.
[target.'cfg(target_os = "windows")'.dependencies]
libsqlite3-sys = { workspace = true }

[features]
ssr = [
    "tidl-web/ssr",
]
